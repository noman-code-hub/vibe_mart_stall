<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&family=Architects+Daughter&family=Bangers&family=Montserrat+Alternates:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Oswald:wght@200..700&display=swap"
      rel="stylesheet"
    />
    <title>Vibe Mart</title>
    <style>
      html.vm-splash-lock,
      html.vm-splash-lock body {
        overflow: hidden !important;
      }

      #vm-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        background: #ffffff;
        transition: opacity 0.42s ease, visibility 0.42s ease;
      }

      #vm-splash.is-done {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      #vm-splash .vm-splash__card {
        display: grid;
        justify-items: center;
        gap: 4px;
        width: min(820px, 100%);
        text-align: center;
      }

      #vm-splash .vm-splash__logo {
        display: block;
        width: min(760px, 92vw);
        height: auto;
        object-fit: contain;
        margin: 0;
        line-height: 0;
        filter: drop-shadow(0 10px 24px rgba(255, 196, 0, 0.22));
      }

      @media (max-width: 640px) {
        #vm-splash .vm-splash__logo {
          width: min(420px, 92vw);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #vm-splash {
          transition: none;
        }
      }
    </style>
    <script>
      window.__vmSplashStartedAt = Date.now()
      document.documentElement.classList.add('vm-splash-lock')
      // Static / Vercel boot config — overrides stale caches that still used /wp-json.
      // WordPress theme injects its own vibeMartConfig instead of this file.
      window.vibeMartConfig = {
        restBase: '/api/vm',
        removeBgUrl: '/api/remove-background',
        basename: '/',
        siteName: 'Vibe Mart',
        isWordPress: false,
      }
    </script>
  </head>
  <body>
    <div id="vm-splash" role="status" aria-live="polite" aria-busy="true" aria-label="Loading Vibe Mart">
      <div class="vm-splash__card">
        <img
          class="vm-splash__logo"
          src="/loading-logo.jpeg?v=1"
          alt="Vibe Mart"
          width="380"
          height="253"
          decoding="async"
        />
      </div>
    </div>
    <div id="vibe-mart-root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
