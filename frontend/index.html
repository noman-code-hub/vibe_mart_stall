<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&family=Architects+Daughter&family=Bangers&family=Montserrat+Alternates:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Oswald:wght@200..700&display=swap"
      rel="stylesheet"
    />
    <title>Vibe Mart</title>
    <style>
      html.vm-splash-lock,
      html.vm-splash-lock body {
        overflow: hidden !important;
      }

      #vm-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        background: #ffffff;
        transition: opacity 0.42s ease, visibility 0.42s ease;
      }

      #vm-splash.is-done {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      #vm-splash .vm-splash__card {
        display: grid;
        justify-items: center;
        gap: 4px;
        width: min(440px, 100%);
        text-align: center;
      }

      #vm-splash .vm-splash__logo {
        display: block;
        width: min(380px, 84vw);
        height: auto;
        object-fit: contain;
        margin: 0;
        line-height: 0;
        filter: drop-shadow(0 10px 24px rgba(255, 196, 0, 0.22));
      }

      #vm-splash .vm-splash__dots {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        min-height: 14px;
        margin: 0;
      }

      #vm-splash .vm-splash__dot {
        width: 12px;
        height: 12px;
        border: 2px solid #1a1008;
        border-radius: 50%;
        background: #ffe600;
        box-shadow: 2px 2px 0 rgba(0, 0, 0, 0.55);
        animation: vm-splash-dot 1s ease-in-out infinite;
      }

      #vm-splash .vm-splash__dot:nth-child(2) {
        animation-delay: 0.15s;
        background: #ff3b2f;
      }

      #vm-splash .vm-splash__dot:nth-child(3) {
        animation-delay: 0.3s;
        background: #025fd7;
      }

      #vm-splash .vm-splash__copy {
        margin: 6px 0 0;
        font-family: system-ui, sans-serif;
        font-size: 0.92rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        color: #1a1008;
      }

      @keyframes vm-splash-dot {
        0%,
        80%,
        100% {
          transform: translateY(0) scale(0.85);
          opacity: 0.45;
        }
        40% {
          transform: translateY(-8px) scale(1.08);
          opacity: 1;
        }
      }

      @media (max-width: 640px) {
        #vm-splash .vm-splash__logo {
          width: min(280px, 86vw);
        }

        #vm-splash .vm-splash__copy {
          font-size: 0.84rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #vm-splash .vm-splash__dot {
          animation: none;
          opacity: 1;
          transform: none;
        }

        #vm-splash {
          transition: none;
        }
      }
    </style>
    <script>
      window.__vmSplashStartedAt = Date.now()
      document.documentElement.classList.add('vm-splash-lock')
      // Static / Vercel boot config — overrides stale caches that still used /wp-json.
      // WordPress theme injects its own vibeMartConfig instead of this file.
      window.vibeMartConfig = {
        restBase: '/api/vm',
        removeBgUrl: '/api/remove-background',
        basename: '/',
        siteName: 'Vibe Mart',
        isWordPress: false,
      }
    </script>
  </head>
  <body>
    <div id="vm-splash" role="status" aria-live="polite" aria-busy="true" aria-label="Loading Vibe Mart">
      <div class="vm-splash__card">
        <img
          class="vm-splash__logo"
          src="/vibe-mart-logo.png?v=2"
          alt="Vibe Mart"
          width="380"
          height="168"
          decoding="async"
        />
        <div class="vm-splash__dots" aria-hidden="true">
          <span class="vm-splash__dot"></span>
          <span class="vm-splash__dot"></span>
          <span class="vm-splash__dot"></span>
        </div>
        <p class="vm-splash__copy">Opening the market…</p>
      </div>
    </div>
    <div id="vibe-mart-root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
